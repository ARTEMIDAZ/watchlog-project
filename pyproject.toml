[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlog"
version = "0.2.0"
description = "Личный консольный трекер фильмов, сериалов и аниме с подтягиванием данных из TMDB и Shikimori"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
watch = "watchlog.cli:main"

[tool.setuptools.packages.find]
include = ["watchlog*"]
